<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtlasHub - Key</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background"></div>

    <nav class="navbar">

        <div class="logo">
            <img src="LogoIcon.png" alt="Logo">
            <h2>Atlas Hub</h2>
        </div>

        <a href="index.html" class="discord-btn">
            Back
        </a>

    </nav>

    <!-- Key Page -->
    <main class="key-page">

        <div class="key-card">

            <h1>AtlasHub - Key</h1>

            <div class="key-box">
                <input
                    type="text"
                    id="keyInput"
                    value="Loading..."
                    readonly
                >
            </div>

            <button id="copyKey" class="copy-key-btn">
                Copy Key
            </button>

            <p id="copyStatus" class="copy-status"></p>

        </div>

    </main>

    <script src="key.js"></script>

</body>

</html>
